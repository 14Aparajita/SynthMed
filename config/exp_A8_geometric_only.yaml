experiment:
  name: "A8_geometric_only"
  seed: 42
  device: "cuda"

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  knowledge_base_dir: "data/knowledge_base"
  image_size: 128
  num_real_train: 100
  num_real_test: 100
  num_synthetic_metadata: 0
  num_synthetic_images: 0
  augmentation_strength: "heavy"

schema:
  schema_path: "config/schema/clinical_metadata.json"
  repair_enabled: false
  repair_max_iterations: 3

retrieval:
  embedder_model: "sentence-transformers/all-MiniLM-L6-v2"
  top_k: 5
  fusion_weights: [0.4, 0.3, 0.3]
  index_path: "outputs/models/faiss_index.bin"
  rag_enabled: false

generation:
  metadata_model: "distilgpt2"
  metadata_max_length: 256
  temperature: 0.7
  diffusion_timesteps: 100
  diffusion_image_size: 32
  diffusion_checkpoint: "outputs/models/diffusion_unet.pt"
  diffusion_epochs: 20
  conditioning_enabled: false

classifier:
  model_name: "mobilenet_v2"
  num_classes: 5
  batch_size: 8
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.001
  use_metadata: false

evaluation:
  metrics: ["accuracy", "f1", "roc_auc"]
  save_results: true
  results_path: "outputs/results"